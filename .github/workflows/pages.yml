# Publishes the app to GitHub Pages so it installs on a phone home screen
# and works offline. Runs on a push to main, or on demand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/logic.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must already be switched on under Settings, Pages, with the
      # source set to GitHub Actions. The workflow token is not allowed to
      # create the site itself.
      # Stamp the commit and date into the page and the worker. A changed
      # worker is what tells the browser a new version exists.
      - name: Stamp the build
        run: |
          BUILD="${GITHUB_SHA:0:7} · $(date -u +%Y-%m-%d)"
          sed -i "s|__BUILD__|$BUILD|g" index.html sw.js
          echo "Stamped: $BUILD"
          grep -n "$BUILD" index.html sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

<body>

<header>
  <div>
    <h1 id="tripName">Italy Bill Split</h1>
    <div class="sub" id="tripSub">Set up your trip to start</div>
  </div>
  <div class="rate" id="rateBadge"></div>
</header>

<div id="updateBar" class="hidden">
  <span>A new version is ready.</span>
  <button data-act="applyUpdate">Update now</button>
</div>

<main class="wrap" id="view"></main>

<nav>
  <button data-tab="trip"><span class="ico">👥</span>Trip</button>
  <button data-tab="receipts"><span class="ico">🧾</span>Receipts</button>
  <button data-tab="summary"><span class="ico">📊</span>Who owes</button>
</nav>

<script>
/* ---------------------------------------------------------------
   Italy Bill Split - single page, offline-friendly, no build step.
   Data lives in this browser only (localStorage).
--------------------------------------------------------------- */

/* The deploy workflow stamps the commit and date into the placeholder
   below. Opened straight from a file it stays unstamped, and the test
   is written to match the stamped shape rather than the placeholder,
   which the same substitution would otherwise rewrite. */
const APP_BUILD = '__BUILD__';
const BUILD_LABEL = /^[0-9a-f]{7} /.test(APP_BUILD) ? APP_BUILD : 'working copy';

const STORE_KEY = 'italy-bill-split-v1';
const KEY_KEY   = 'italy-bill-split-apikey';
const PALETTE = ['#2563EB','#059669','#D97706','#DC2626','#7C3AED','#0891B2','#DB2777','#65A30D'];
const SHARED_WORDS = ['all','tutti','tutto','everyone','shared','share','table','tavolo','*'];
const SHARED_ITEM_HINTS = ['coperto','servizio','service','mancia','tip','acqua','vino','bottiglia','pane','antipast','iva','tax','caraffa','birra grande'];

let state = blankState();
let ui = { tab:'trip', receiptId:null, queueLine:null, busy:false, msg:'', err:'',
           newGroupName:'', newGroupMembers:[], storedIn:'', pendingImport:null };

/* ---------- storage ---------- */
function blankState(){
  return {
    trip:{ name:'Italy 2026', rate:1.47 },
    people:[],
    groups:[],
    receipts:[],
    model:'claude-opus-5'
  };
}
/* ---------- where the trip is kept ----------------------------------
   IndexedDB holds it, with room measured in hundreds of megabytes rather
   than the five or so localStorage allows. localStorage stays as the
   fallback for a private window, and as the place older trips are read
   from once. Snapshots keep a short history so a bad edit is recoverable.
--------------------------------------------------------------------- */
const DB_NAME = 'italy-bill-split', DB_STORE = 'trip', CURRENT_KEY = 'current';
const SNAP_KEEP = 20, SNAP_EVERY_MS = 10 * 60 * 1000;

const idbReady = () => typeof indexedDB !== 'undefined' && !!indexedDB;

function idbOpen(){
  return new Promise((resolve, reject) => {
    if(!idbReady()) return reject(new Error('no indexeddb here'));
    let req;
    try{ req = indexedDB.open(DB_NAME, 1); }
    catch(e){ return reject(e); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error || new Error('indexeddb refused'));
    req.onblocked = () => reject(new Error('indexeddb blocked'));
  });
}

function idbDo(mode, fn){
  return idbOpen().then(db => new Promise((resolve, reject) => {
    let request;
    const tx = db.transaction(DB_STORE, mode);
    try{ request = fn(tx.objectStore(DB_STORE)); }
    catch(e){ reject(e); return; }
    tx.oncomplete = () => resolve(request ? request.result : undefined);
    tx.onerror    = () => reject(tx.error);
    tx.onabort    = () => reject(tx.error || new Error('write aborted'));
  }));
}
const storePut  = (k, v) => idbDo('readwrite', s => s.put(v, k));
const storeGet  = k      => idbDo('readonly',  s => s.get(k));
const storeDel  = k      => idbDo('readwrite', s => s.delete(k));
const storeKeys = ()     => idbDo('readonly',  s => s.getAllKeys());

/* Fill in anything a saved or imported trip is missing, and carry older
   shapes forward, so one path handles both loading and restoring. */
function hydrate(obj){
  const t = Object.assign(blankState(), obj || {});
  if(!Array.isArray(t.people))   t.people = [];
  if(!Array.isArray(t.receipts)) t.receipts = [];
  if(!Array.isArray(t.groups))   t.groups = [];
  if(!t.trip || typeof t.trip !== 'object') t.trip = blankState().trip;

  const everyone = t.people.map(p => p.id);
  t.receipts.forEach(r => (r.lines || []).forEach(l => {
    // Older saves stored the sentinel 'ALL'. Freeze it to the roster.
    if(l.assigned === 'ALL'){ l.assigned = everyone.slice(); l.all = true; }
    if(l.all === undefined){
      const ids = Array.isArray(l.assigned) ? l.assigned : [];
      l.all = everyone.length > 0 && everyone.every(id => ids.includes(id));
    }
  }));
  return t;
}

/* ---------- merging two phones' copies ------------------------------
   Every person, household and receipt carries the time it last changed,
   and a deletion leaves a dated marker behind. Merging then takes the
   later edit of each one, so two phones adding different receipts never
   collide, and only the same receipt edited twice can lose a change.
--------------------------------------------------------------------- */
const nowIso = () => new Date().toISOString();
const later = (a, b) => ((a || '') >= (b || '') ? (a || '') : (b || ''));

function touch(o){ if(o && typeof o === 'object') o.updatedAt = nowIso(); return o; }

function bury(kind, id){
  if(!state.deleted) state.deleted = {};
  if(!state.deleted[kind]) state.deleted[kind] = {};
  state.deleted[kind][id] = nowIso();
}

function mergeTrips(mine, theirs){
  const out = hydrate(JSON.parse(JSON.stringify(mine || {})));
  const them = hydrate(JSON.parse(JSON.stringify(theirs || {})));
  const KINDS = ['people', 'groups', 'receipts'];

  // Deletions from either side, keeping whichever happened later.
  const graves = {};
  for(const kind of KINDS){
    graves[kind] = Object.assign({}, (out.deleted || {})[kind] || {});
    const other = (them.deleted || {})[kind] || {};
    for(const id in other) graves[kind][id] = later(graves[kind][id], other[id]);
  }
  out.deleted = graves;

  for(const kind of KINDS){
    const byId = {}, order = [];
    const take = item => {
      if(!item || !item.id) return;
      if(!(item.id in byId)) order.push(item.id);          // my order first, theirs appended
      const held = byId[item.id];
      if(!held || (item.updatedAt || '') > (held.updatedAt || '')) byId[item.id] = item;
    };
    out[kind].forEach(take);
    them[kind].forEach(take);

    out[kind] = order
      .filter(id => {
        const stone = graves[kind][id];
        return !(stone && stone >= (byId[id].updatedAt || ''));   // deleted after its last edit
      })
      .map(id => byId[id]);
  }

  // Trip settings move as one block, since a name and a rate are not
  // meaningfully mergeable on their own.
  if((them.trip.updatedAt || '') > (out.trip.updatedAt || '')) out.trip = them.trip;
  out.lastBackupAt = later(out.lastBackupAt, them.lastBackupAt) || undefined;

  // Two phones may have handed out the same colour. Keep them distinct.
  const used = [];
  out.people.forEach(p => {
    if(!p.colour || used.includes(p.colour)){
      p.colour = PALETTE.find(c => !used.includes(c)) || PALETTE[used.length % PALETTE.length];
    }
    used.push(p.colour);
  });

  // A household may have lost a member to a deletion on the other phone.
  const living = out.people.map(p => p.id);
  out.groups.forEach(g => { g.memberIds = (g.memberIds || []).filter(id => living.includes(id)); });
  out.groups = out.groups.filter(g => (g.memberIds || []).length > 1);
  return out;
}

/* Says why a file is not a trip, or an empty string when it is one. */
function validateBackup(obj){
  if(!obj || typeof obj !== 'object' || Array.isArray(obj)) return 'That file is not a trip backup.';
  if(!Array.isArray(obj.people) && !Array.isArray(obj.receipts)) return 'That file has no people and no receipts in it.';
  if(obj.people && !Array.isArray(obj.people)) return 'The people in that file are not readable.';
  if(obj.receipts && !Array.isArray(obj.receipts)) return 'The receipts in that file are not readable.';
  return '';
}

async function loadState(){
  try{
    const held = await storeGet(CURRENT_KEY);
    if(held) return hydrate(held);
  }catch(e){ /* fall through to the older store */ }
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return hydrate(JSON.parse(raw));
  }catch(e){}
  return blankState();
}

let saveChain = Promise.resolve(), lastSnapAt = 0, movedOffLocal = false;

function save(){
  state.updatedAt = new Date().toISOString();
  const snapshot = JSON.parse(JSON.stringify(state));   // what this call promised to write
  saveChain = saveChain.then(async () => {
    try{
      await storePut(CURRENT_KEY, snapshot);
      ui.saveFailed = false; ui.storedIn = 'IndexedDB';
      await maybeSnapshot(snapshot);
      if(!movedOffLocal){                                // the old copy is now stale
        movedOffLocal = true;
        try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      }
    }catch(e){
      try{
        localStorage.setItem(STORE_KEY, JSON.stringify(snapshot));
        ui.saveFailed = false; ui.storedIn = 'localStorage';
      }catch(e2){
        // Nothing is being written any more, so say so where it cannot be missed.
        ui.saveFailed = true;
        ui.err = 'Could not save: ' + (e2.message || e.message);
      }
    }
  }).catch(() => {});
  return true;
}

async function maybeSnapshot(what){
  const now = Date.now();
  if(now - lastSnapAt < SNAP_EVERY_MS) return;
  lastSnapAt = now;
  try{
    await storePut('snap:' + new Date(now).toISOString(), what);
    const keys = (await storeKeys() || []).map(String).filter(k => k.startsWith('snap:')).sort();
    for(const k of keys.slice(0, Math.max(0, keys.length - SNAP_KEEP))) await storeDel(k);
  }catch(e){}
}
function getKey(){ try{ return localStorage.getItem(KEY_KEY)||''; }catch(e){ return ''; } }
function setKey(v){ try{ v ? localStorage.setItem(KEY_KEY,v) : localStorage.removeItem(KEY_KEY); }catch(e){} }

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const round2 = n => Math.round((Number(n)||0)*100)/100;
const eur = n => '€' + round2(n).toFixed(2);
const cad = n => cadAt(Number(state.trip.rate)||0, n);
const cadAt = (rate, n) => 'C$' + round2((Number(n)||0)*(Number(rate)||0)).toFixed(2);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person = id => state.people.find(p=>p.id===id);
const receipt = id => state.receipts.find(r=>r.id===id);
const group  = id => state.groups.find(g=>g.id===id);

/* Couples and households -------------------------------------------
   Lines are still assigned to individuals. A household is who settles
   together, so a bill paid by one partner is owed back by the other
   household as a whole, not by each person separately.
-------------------------------------------------------------------- */
function groupOf(personId){
  return state.groups.find(g => g.memberIds.includes(personId)) || null;
}
function groupMembers(g){
  return (g ? g.memberIds : []).filter(id => person(id));
}
function unitKey(personId){
  const g = groupOf(personId);
  return g ? 'g:' + g.id : 'p:' + personId;
}
/* One entry per settling unit, in roster order. */
function unitList(){
  const seen = [], out = [];
  for(const p of state.people){
    const key = unitKey(p.id);
    if(seen.includes(key)) continue;
    seen.push(key);
    const g = groupOf(p.id);
    const members = g ? groupMembers(g) : [p.id];
    out.push({
      key,
      name: g ? g.name : p.name,
      colour: (person(members[0]) || p).colour,
      memberIds: members,
      isGroup: !!g
    });
  }
  return out;
}
function parseAmount(v){
  if(typeof v === 'number') return v;
  let s = String(v||'').replace(/[^\d,.\-]/g,'');
  if(s.includes(',') && s.includes('.')) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else s = s.replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function today(){ return new Date().toISOString().slice(0,10); }

/* ---------- notation matching -----------------------------------
   A line counts as "noted" when its text carries initials or a name
   from the trip roster, or a shared-table marker.
------------------------------------------------------------------ */
function matchNotation(text){
  const raw = ' ' + String(text||'').toLowerCase().replace(/[()\[\]{}]/g,' ') + ' ';
  for(const w of SHARED_WORDS){
    const pat = w === '*' ? /\s\*\s/ : new RegExp('(^|[\\s,+/\\-])'+w+'([\\s,+/\\-]|$)');
    if(pat.test(raw)) return { ids:'ALL', why:'marked shared' };
  }
  const hits = [];
  for(const p of state.people){
    const tokens = [p.tag, p.name, p.name.split(/\s+/)[0]].filter(Boolean).map(t=>t.toLowerCase());
    for(const t of tokens){
      if(t.length < 1) continue;
      const pat = new RegExp('(^|[\\s,+/\\-])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([\\s,+/\\-.]|$)');
      if(pat.test(raw)){ hits.push(p.id); break; }
    }
  }
  if(hits.length) return { ids:[...new Set(hits)], why:'noted on receipt' };
  return null;
}
/* ---------- Italian to English --------------------------------------
   A working glossary for trattoria, bar and alimentari receipts. Claude
   supplies a translation with each line it reads; this covers lines you
   type, paste or pull off on-device OCR, and works with no connection.
--------------------------------------------------------------------- */
const IT_EN = {
  // service and receipt wording
  'coperto':'cover charge','servizio':'service charge','servizio incluso':'service included',
  'mancia':'tip','sconto':'discount','supplemento':'supplement','asporto':'takeaway',
  'consumazione':'drink included','iva':'VAT','menu del giorno':'menu of the day',
  'sconto fedelta':'loyalty discount','fedelta':'loyalty','servizio 10':'service charge 10%',
  'menu turistico':'tourist menu','piatto del giorno':'dish of the day',
  // courses
  'antipasto':'starter','antipasti':'starters','antipasto misto':'mixed starters',
  'primo':'first course','primi':'first courses','secondo':'main course','secondi':'main courses',
  'contorno':'side dish','contorni':'side dishes','dolce':'dessert','dolci':'desserts',
  'frutta':'fruit','macedonia':'fruit salad','degustazione':'tasting',
  // pasta and grains
  'pasta':'pasta','spaghetti':'spaghetti','penne':'penne','rigatoni':'rigatoni',
  'tagliatelle':'tagliatelle','fettuccine':'fettuccine','linguine':'linguine',
  'bucatini':'bucatini','pappardelle':'pappardelle','orecchiette':'orecchiette',
  'trofie':'trofie','farfalle':'farfalle','gnocchi':'potato dumplings','ravioli':'ravioli',
  'tortellini':'tortellini','lasagne':'lasagne','cannelloni':'cannelloni',
  'risotto':'risotto','riso':'rice','farro':'spelt','polenta':'polenta','zuppa':'soup',
  'minestrone':'vegetable soup','brodo':'broth','minestra':'soup',
  // sauces and preparations
  'ragu':'meat sauce','bolognese':'meat sauce','carbonara':'carbonara','amatriciana':'amatriciana',
  'cacio e pepe':'cheese and pepper','pesto':'pesto','pomodoro':'tomato','pomodori':'tomatoes',
  'arrabbiata':'spicy tomato','puttanesca':'puttanesca','aglio e olio':'garlic and oil',
  'quattro formaggi':'four cheeses','frutti di mare':'seafood','scoglio':'seafood',
  'norma':'aubergine and ricotta','genovese':'onion and beef',
  'griglia':'grill','alla griglia':'grilled','ai ferri':'grilled','arrosto':'roast',
  'al forno':'baked','fritto':'fried','fritta':'fried','fritte':'fried','fritti':'fried',
  'fritto misto':'mixed fried seafood','bollito':'boiled','crudo':'raw','cotto':'cooked',
  'ripieno':'stuffed','misto':'mixed','mista':'mixed','piccante':'spicy','gratinato':'gratin',
  'in umido':'stewed','al vapore':'steamed','saltati':'sauteed','della casa':'house',
  'senza glutine':'gluten free','vegetariano':'vegetarian','biologico':'organic',
  // meat
  'carne':'meat','manzo':'beef','vitello':'veal','maiale':'pork','agnello':'lamb',
  'pollo':'chicken','tacchino':'turkey','anatra':'duck','coniglio':'rabbit',
  'cinghiale':'wild boar','bistecca':'steak','tagliata':'sliced steak',
  'filetto':'fillet','costata':'rib steak','salsiccia':'sausage','polpette':'meatballs',

/* English readings that work as adjectives. Italian trails them after the
   noun, English leads with them, so these get moved to the front:
   "branzino alla griglia" reads as "grilled sea bass", not "sea bass grilled". */
const IT_MODIFIER = new Set([
  'grilled','baked','fried','roast','boiled','steamed','stewed','sauteed','gratin',
  'raw','cooked','stuffed','mixed','spicy','smoked','fresh','local','traditional',
  'seasonal','organic','vegetarian','gluten free','house','still','sparkling',
  'red','white','small','medium','large','double','half','draught'
]);

/* Words carried across without counting toward how much was understood. */
const IT_GLUE = {
  'al':'with','alla':'with','alle':'with','allo':'with','ai':'with','agli':'with',
  'con':'with','di':'of','del':'of','della':'of','dello':'of','dei':'of','delle':'of','degli':'of',
  'all':'with','dell':'of','nell':'in','sull':'on','nel':'in','sul':'on',
  'e':'and','ed':'and','in':'in','da':'from','su':'on','per':'for','a':'','ad':'',
  'il':'','lo':'','la':'','i':'','gli':'','le':'','un':'','uno':'','una':'',"l'":'',"d'":''
};

function normalizeIt(s){
  return String(s||'')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')   // caffè -> caffe
    .toLowerCase()
    .replace(/^\s*\d+\s*[x×]\s*/,'')                    // drop a leading "2 x"
    .replace(/['’]/g,' ')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

/* Returns an English reading, or null when too little was recognised to
   be worth showing. Never guesses at a word it does not hold. */
function translateItem(desc){
  const norm = normalizeIt(desc);
  if(!norm) return null;
  if(IT_EN[norm]) return IT_EN[norm] === norm ? null : sentence(IT_EN[norm]);

  const words = norm.split(' ');
  const out = [];
  let known = 0, counted = 0;

  for(let i = 0; i < words.length; i++){
    let hit = null, span = 1;
    for(let n = Math.min(4, words.length - i); n >= 1; n--){       // longest phrase first
      const phrase = words.slice(i, i + n).join(' ');
      if(IT_EN[phrase]){ hit = IT_EN[phrase]; span = n; break; }
    }
    if(hit){ out.push(hit); known++; counted++; i += span - 1; continue; }

    const w = words[i];
    if(Object.prototype.hasOwnProperty.call(IT_GLUE, w)){ out.push(IT_GLUE[w]); continue; }
    if(w.length <= 1){ out.push(''); continue; }
    if(/^\d+([.,]\d+)?$/.test(w)){ out.push(w); continue; }
    out.push(w); counted++;                                         // left as printed
  }

  if(!known || known / counted < 0.5) return null;

  const lead = [], rest = [];
  out.filter(Boolean).forEach((w, i) => (i > 0 && IT_MODIFIER.has(w) ? lead : rest).push(w));

  // "calice vino bianco" builds "glass of wine white wine"; drop the earlier
  // copy of a repeated word and any joining word left stranded at an end.
  const GLUE_OUT = new Set(['with','of','and','in','from','on','for']);
  let parts = lead.concat(rest).join(' ').split(/\s+/).filter(Boolean);
  parts = parts.filter((w, i) => GLUE_OUT.has(w) || parts.indexOf(w, i + 1) === -1);
  while(parts.length && GLUE_OUT.has(parts[0])) parts.shift();
  while(parts.length && GLUE_OUT.has(parts[parts.length - 1])) parts.pop();

  const text = parts.join(' ').trim();
  return (!text || text === norm) ? null : sentence(text);
}
function sentence(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function suggestShared(desc){
  const d = String(desc||'').toLowerCase();
  return SHARED_ITEM_HINTS.some(w => d.includes(w));
}

/* ---------- money maths ---------- */
function lineOwners(line){
  if(line.assigned === 'ALL') return state.people.map(p=>p.id);   // pre-snapshot data
  if(Array.isArray(line.assigned)) return line.assigned.filter(id=>person(id));
  return [];
}

/* Everyone means everyone who was on the trip when you tapped it. Adding
   a traveller later must not quietly re-split last Tuesday's dinner. */
function everyoneNow(){ return state.people.map(p => p.id); }
function syncAllFlag(line){
  const ids = Array.isArray(line.assigned) ? line.assigned : [];
  line.all = state.people.length > 0 && state.people.every(p => ids.includes(p.id));
}
function receiptLinesTotal(r){ return round2(r.lines.reduce((s,l)=>s+(Number(l.amount)||0),0)); }
function receiptGrandEur(r){ return round2(receiptLinesTotal(r) + parseAmount(r.extra)); }

/* When the card statement shows what a receipt actually cost in dollars,
   that beats any nominal rate: it carries the issuer's spread and fees.
   The receipt then converts at its own rate, and the rest of the trip
   carries on at the rate you set. */
function receiptRate(r){
  const actual = parseAmount(r && r.actualCad);
  const eurTotal = r ? receiptGrandEur(r) : 0;
  if(actual > 0 && eurTotal > 0) return actual / eurTotal;
  return Number(state.trip.rate) || 0;
}
function receiptHasActual(r){ return parseAmount(r && r.actualCad) > 0 && receiptGrandEur(r) > 0; }
const rcad = (r, n) => cadAt(receiptRate(r), n);

/* One rate across the whole trip, weighted by what each receipt cost.
   Used where a figure spans receipts that converted differently. */
function blendedRate(){
  let e = 0, c = 0;
  for(const r of state.receipts){
    const amt = receiptGrandEur(r);
    if(amt <= 0) continue;
    e += amt; c += amt * receiptRate(r);
  }
  return e > 0 ? c / e : (Number(state.trip.rate) || 0);
}
function receiptUnassigned(r){ return round2(r.lines.filter(l=>lineOwners(l).length===0).reduce((s,l)=>s+(Number(l.amount)||0),0)); }

/* Shares for one receipt: {personId: amount}.
   Everything runs in whole cents and every leftover cent is handed to a
   real person, so the shares always add back to the receipt exactly.
   Extra (tip or rounding) rides on each person's share of the items. */
function receiptShares(r){
  const cents = {};
  state.people.forEach(p => cents[p.id] = 0);
  let rotate = 0;

  for(const l of r.lines){
    const owners = lineOwners(l);
    if(!owners.length) continue;
    const amt = Math.round((Number(l.amount)||0) * 100);
    const base = Math.trunc(amt / owners.length);
    owners.forEach(id => { cents[id] += base; });

    // Spread the odd cents one at a time, starting from a different
    // person on each line so the same person is not always rounded up.
    let left = amt - base * owners.length;
    const step = left >= 0 ? 1 : -1;
    for(let k = 0; left !== 0; k++, left -= step){
      cents[owners[(rotate + k) % owners.length]] += step;
    }
    rotate++;
  }

  const extra = Math.round(parseAmount(r.extra) * 100);
  if(extra){
    const itemTotal = Object.values(cents).reduce((a,b) => a+b, 0);
    const ids = itemTotal > 0
      ? state.people.map(p => p.id).filter(id => cents[id] !== 0)
      : state.people.map(p => p.id);
    if(ids.length){
      let handed = 0;
      if(itemTotal > 0){
        ids.forEach(id => {
          const cut = Math.trunc(extra * cents[id] / itemTotal);
          cents[id] += cut; handed += cut;
        });
      }else{
        const each = Math.trunc(extra / ids.length);
        ids.forEach(id => { cents[id] += each; handed += each; });
      }
      let left = extra - handed;
      const step = left >= 0 ? 1 : -1;
      for(let k = 0; left !== 0; k++, left -= step) cents[ids[k % ids.length]] += step;
    }
  }

  const out = {};
  state.people.forEach(p => out[p.id] = cents[p.id] / 100);
  return out;
}
function tripTotals(){
  const owed = {}, paid = {}, owedCad = {}, paidCad = {};
  state.people.forEach(p => { owed[p.id]=0; paid[p.id]=0; owedCad[p.id]=0; paidCad[p.id]=0; });
  for(const r of state.receipts){
    const sh = receiptShares(r);
    const rate = receiptRate(r);            // this receipt's own conversion
    Object.keys(sh).forEach(id => {
      if(owed[id]===undefined) return;
      owed[id] += sh[id];
      owedCad[id] += sh[id] * rate;
    });
    if(r.payerId && paid[r.payerId]!==undefined){
      const total = Object.values(sh).reduce((a,b)=>a+b,0);
      paid[r.payerId] += total;
      paidCad[r.payerId] += total * rate;
    }
  }
  state.people.forEach(p => {
    owed[p.id]=round2(owed[p.id]); paid[p.id]=round2(paid[p.id]);
    owedCad[p.id]=round2(owedCad[p.id]); paidCad[p.id]=round2(paidCad[p.id]);
  });
  return { owed, paid, owedCad, paidCad };
}
/* Each unit's owed and paid, summed from its members. */
function unitTotals(){
  const { owed, paid, owedCad, paidCad } = tripTotals();
  const sum = (ids, src) => round2(ids.reduce((s,id) => s + (src[id]||0), 0));
  return unitList().map(u => Object.assign({}, u, {
    owed: sum(u.memberIds, owed),       paid: sum(u.memberIds, paid),
    owedCad: sum(u.memberIds, owedCad), paidCad: sum(u.memberIds, paidCad)
  }));
}

function settlements(){
  const units = unitTotals();
  const byKey = {};
  units.forEach(u => byKey[u.key] = u.name);
  const bal = units.map(u => ({ id:u.key, net: round2(u.paid - u.owed) }));
  const cred = bal.filter(b=>b.net>0.009).sort((a,b)=>b.net-a.net);
  const debt = bal.filter(b=>b.net<-0.009).sort((a,b)=>a.net-b.net);
  const moves = [];
  let i=0, j=0;
  while(i<debt.length && j<cred.length){
    const amt = round2(Math.min(-debt[i].net, cred[j].net));
    if(amt > 0.009) moves.push({
      from: debt[i].id, to: cred[j].id, amount: amt,
      fromName: byKey[debt[i].id], toName: byKey[cred[j].id]
    });
    debt[i].net = round2(debt[i].net + amt);
    cred[j].net = round2(cred[j].net - amt);
    if(Math.abs(debt[i].net) < 0.01) i++;
    if(Math.abs(cred[j].net) < 0.01) j++;
  }
  return moves;
}

    <div class="totrow"><span>On this phone</span><span>${countOf(state.people.length,'person','people')} · ${countOf(state.receipts.length,'receipt','receipts')}</span></div>
    <div class="btnrow" style="margin-top:12px">
      <button class="primary" data-act="doMerge" style="flex:1">Merge them</button>
      <button data-act="doReplace">Replace</button>
      <button class="ghost" data-act="cancelImport">Cancel</button>
    </div>
    <p class="sub" style="margin-top:8px">Merging keeps both sides, taking the later edit of any receipt they both hold. Replacing throws away what is on this phone. Either way a snapshot is kept first.</p>
  </div>` : ''}

  <div class="card">
    <h2>Your data</h2>
    ${backupAge() !== null && backupAge() >= 3 && state.receipts.length ? `<div class="notice">Last backup was ${backupAge()} days ago. Download one now.</div>` : ''}
    ${backupAge() === null && state.receipts.length ? '<div class="notice">You have never taken a backup. Download one now and put it somewhere off this phone.</div>' : ''}
    <div class="btnrow">
      <button class="primary" data-act="shareTrip">Send to another phone</button>
      <button data-act="exportJson">Download backup</button>
      <label class="chip" style="padding:11px 14px;border-radius:10px">Restore from backup
        <input type="file" accept="application/json,.json" data-act="importJson" style="display:none"></label>
      <button class="danger" data-act="resetAll">Erase everything</button>
    </div>
    <div class="totrow tiny muted" style="margin-top:10px">
      <span>Held in</span><span>${esc(ui.storedIn || (idbReady() ? 'IndexedDB' : 'localStorage'))} · ${stateSizeKb()} KB</span>
    </div>
    <div class="totrow tiny muted">
      <span>Last backup</span><span>${state.lastBackupAt ? esc(state.lastBackupAt.slice(0,10)) : 'never'}</span>
    </div>
    <p class="sub" style="margin-top:8px">Send to another phone hands the trip over by AirDrop, message or any app on your share sheet. On the other phone, open Restore from backup and pick the file, then choose merge or replace.</p>
    <p class="sub">Everything lives on this phone. Clearing website data wipes it, and a lost phone takes the trip with it, so keep a backup in Files or iCloud. Restoring replaces what is here, and a snapshot is kept first so it is undoable.</p>
  </div>`;
}

function viewReceiptList(){
  const rows = state.receipts.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>{
    const un = receiptUnassigned(r);
    const tot = round2(receiptLinesTotal(r) + parseAmount(r.extra));
    return `
    <button class="rcpt" data-act="openReceipt" data-id="${r.id}">
      <span>
        <strong>${esc(r.place||'Receipt')}</strong><br>
        <span class="muted small">${esc(r.date||'')} · ${r.lines.length} lines${un>0?` · <span style="color:var(--warn)">${eur(un)} unassigned</span>`:''}</span>
      </span>
      <span class="amt">${eur(tot)}<br><span class="tiny muted">${rcad(r, tot)}${receiptHasActual(r) ? ' actual' : ''}</span></span>
    </button>`;
  }).join('') || '<p class="muted small">No receipts yet.</p>';

  return `
  <div class="card">
    <h2>Receipts</h2>
    ${rows}
    <button class="primary wide" data-act="newReceipt" style="margin-top:12px">Add a receipt</button>
  </div>`;
}

function viewReceipt(){
  const r = receipt(ui.receiptId);
  if(!r){ ui.receiptId=null; return viewReceiptList(); }
  if(!state.people.length){
    return `<div class="card"><p class="notice">Add the people on your trip first, on the Trip tab.</p>
      <button data-act="backToList">Back</button></div>`;
  }

  const unassigned = r.lines.filter(l => lineOwners(l).length===0);
  const done = r.lines.length - unassigned.length;
  const pct = r.lines.length ? Math.round(done/r.lines.length*100) : 0;
  const linesTotal = receiptLinesTotal(r);
  const grand = round2(linesTotal + parseAmount(r.extra));
  const stated = parseAmount(r.statedTotal);
  const diff = stated ? round2(grand - stated) : 0;
  const actualUsed = receiptHasActual(r);
  const tripRate = Number(state.trip.rate) || 0;
  const spreadPct = tripRate > 0 ? (receiptRate(r) / tripRate - 1) * 100 : 0;
  const shares = receiptShares(r);

  return `
  <div class="card">
    <button class="ghost small" data-act="backToList" style="padding:4px 0;border:0">← All receipts</button>
    <div class="row" style="margin-top:8px">
      <div class="field"><label>Place</label><input value="${esc(r.place)}" data-act="setPlace" data-id="${r.id}" placeholder="Trattoria Roma"></div>
      <div class="field" style="flex:0 1 150px"><label>Date</label><input type="date" value="${esc(r.date)}" data-act="setDate" data-id="${r.id}"></div>
    </div>
    <div class="field"><label>Who paid the bill</label>
      <select data-act="setPayer" data-id="${r.id}">
        <option value="">Not set</option>
        ${state.people.map(p=>`<option value="${p.id}"${r.payerId===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}
      </select></div>
  </div>

  ${photoCard(r)}

  ${r.readBy === 'device' && r.lines.length ? `
  <div class="notice">Read on this device without an API key. Check every line and amount against the paper before assigning. On-device reading struggles with faded Italian receipts.</div>` : ''}

  ${r.lines.length ? `
  <div class="card">
    <h2>Assigning lines</h2>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="small muted">${done} of ${r.lines.length} lines have an owner</div>
  </div>` : ''}

  ${(unassigned.length || ui.queueLine) ? queueCard(r, unassigned) : (r.lines.length ? `<div class="card"><h2>✅ Every line has an owner</h2><p class="sub">Check the split below, then head to Who owes.</p></div>` : '')}

  <div class="card">
    <h2>Lines</h2>
    ${r.lines.map(l=>lineRow(r,l)).join('') || '<p class="muted small">No lines yet. Upload a photo or add them by hand.</p>'}
    <details style="margin-top:10px"><summary>Add a line by hand</summary>
      <div class="inline-edit" style="margin-top:8px">
        <input id="nlDesc" placeholder="Item">
        <input id="nlAmt" inputmode="decimal" placeholder="0,00">
        <button data-act="addLine" data-id="${r.id}">+</button>
      </div>
    </details>
  </div>

  <div class="card">
    <h2>Receipt totals</h2>
    <div class="totrow"><span>Lines</span><span>${eur(linesTotal)}</span></div>
    <div class="field" style="margin-top:8px"><label>Tip or rounding (split by share)</label>
      <input inputmode="decimal" value="${r.extra||''}" placeholder="0,00" data-act="setExtra" data-id="${r.id}"></div>
    <div class="field"><label>Total printed on the receipt (optional check)</label>
      <input inputmode="decimal" value="${r.statedTotal||''}" placeholder="0,00" data-act="setStated" data-id="${r.id}"></div>
    <div class="field"><label>Actual charged in CAD (from your card statement)</label>
      <input inputmode="decimal" value="${r.actualCad||''}" placeholder="leave blank to use the trip rate" data-act="setActualCad" data-id="${r.id}"></div>
    <div class="totrow big"><span>Total</span><span>${eur(grand)} <span class="tiny muted">${rcad(r, grand)}</span></span></div>
    <div class="totrow tiny muted">
      <span>${actualUsed ? 'Rate from your statement' : 'Trip rate'}</span>
      <span>€1 = C$${receiptRate(r).toFixed(4)}${actualUsed && tripRate > 0 ? ` · ${spreadPct >= 0 ? '+' : ''}${spreadPct.toFixed(1)}% vs the trip rate` : ''}</span>
    </div>
    ${stated && Math.abs(diff)>0.01 ? `<div class="notice" style="margin-top:10px">Out by ${eur(Math.abs(diff))} against the printed total. ${diff>0?'Your lines add up to more than the receipt.':'A line is probably missing.'}</div>` : ''}
    ${receiptUnassigned(r)>0 ? `<div class="notice">${eur(receiptUnassigned(r))} still has no owner and is left out of the split.</div>` : ''}
  </div>

  <div class="card">
    <h2>This receipt by person</h2>
    ${state.people.map(p=>{
      const amt = shares[p.id]||0;
      if(amt<=0.004) return '';
      return `<div class="totrow"><span><span class="tag" style="background:${p.colour}">${esc(p.tag)}</span> ${esc(p.name)}</span><span>${eur(amt)} <span class="tiny muted">${rcad(r, amt)}</span></span></div>`;
    }).join('') || '<p class="muted small">Nothing assigned yet.</p>'}
  </div>

  <div class="card">
    <button class="danger wide ghost" data-act="delReceipt" data-id="${r.id}">Delete this receipt</button>
  </div>`;
}

function photoCard(r){
  const key = getKey();
  return `
  <div class="card">
    <h2>Receipt photo</h2>
    <p class="sub">Pick one from your photo library, or take a new one. ${key ? 'Claude reads it.' : '<strong>No API key set, so the reading happens on this device.</strong> It is free but unreliable on faded receipts, so check every line. A key on the Trip tab fixes that for about a cent a receipt.'}</p>
    <!-- No capture attribute, so the phone offers the library alongside the
         camera. Photograph receipts over dinner and sort them out later. -->
    <input type="file" accept="image/*" id="photoInput" data-act="photo" data-id="${r.id}">
    <div id="ocrStatus" class="small muted" style="margin-top:8px">${ui.busy?'<span class="spin"></span> Reading the receipt...':''}${ui.err?`<span class="err">${esc(ui.err)}</span>`:''}</div>
    ${r.photo ? `<img class="thumb" src="${r.photo}" alt="Receipt photo">` : ''}
    <details style="margin-top:10px"><summary>Or paste receipt text</summary>
      <textarea id="pasteText" placeholder="Pasta al ragu 14,00&#10;Vino rosso 22,00 J&#10;Coperto 6,00"></textarea>
      <button class="wide" data-act="parsePaste" data-id="${r.id}" style="margin-top:8px">Read these lines</button>
    </details>
  </div>`;
}

/* The line on screen stays put while you tap people, so one line can be
   split between two or three of you. It only moves on when you say so. */
function currentQueueLine(r, unassigned){
  if(ui.queueLine){
    const held = r.lines.find(l => l.id === ui.queueLine);
    if(held) return held;
    ui.queueLine = null;
  }
  return unassigned[0] || null;
}
function queueCard(r, unassigned){
  const l = currentQueueLine(r, unassigned);
  if(!l) return '';
  const picked = lineOwners(l);
  const isAll = !!l.all;
  const hint = suggestShared(l.desc);
  const chosen = isAll ? state.people.length : picked.length;
  const each = chosen ? round2((Number(l.amount)||0)/chosen) : 0;
  const left = unassigned.length - (chosen ? 1 : 0);

  return `
  <div class="queue">
    <div class="small muted">No notation on this line · ${unassigned.length} still to place</div>
    <h3 style="margin:6px 0 2px;font-size:18px">${esc(l.desc||'Item')}</h3>
    ${l.en ? `<div class="small muted">${esc(l.en)}</div>` : ''}
    ${l.qty && l.qty>1 ? `<div class="small muted">Quantity ${l.qty}</div>` : ''}
    <div class="q-amt">${eur(l.amount)} <span class="tiny muted">${rcad(r, l.amount)}</span></div>
    <p class="sub" style="margin-top:8px">Who is this for? Tap everyone sharing it.</p>
    <div class="chips">
      ${state.people.map(p=>{
        const on = isAll || picked.includes(p.id);
        return `<button class="chip${on?' on':''}" style="${on?`background:${p.colour}`:''}" data-act="assignOne" data-line="${l.id}" data-id="${r.id}" data-person="${p.id}"><span class="dot" style="background:${on?'#fff':p.colour}"></span>${esc(p.name)}</button>`;
      }).join('')}
    </div>
    ${state.groups.filter(g => groupMembers(g).length > 1).length ? `
    <div class="chips" style="margin-top:8px">
      ${state.groups.filter(g => groupMembers(g).length > 1).map(g => {
        const ids = groupMembers(g);
        const colour = person(ids[0]).colour;
        const on = !isAll && ids.every(id => picked.includes(id));
        return `<button class="chip${on?' on':''}" style="${on?`background:${colour}`:''}" data-act="assignGroup" data-line="${l.id}" data-id="${r.id}" data-group="${g.id}"><span class="dot" style="background:${on?'#fff':colour}"></span>${esc(g.name)}</button>`;
      }).join('')}
    </div>` : ''}
    <div class="btnrow" style="margin-top:10px">
      <button class="${chosen?'':'primary '}" data-act="assignAll" data-line="${l.id}" data-id="${r.id}" style="flex:1">${hint&&!chosen?'Everyone (likely)':'Everyone'}</button>
      ${chosen
        ? `<button class="primary" data-act="nextLine" data-id="${r.id}" style="flex:1">${left>0?'Next line':'Done'}</button>`
        : `<button data-act="skipLine" data-line="${l.id}" data-id="${r.id}">Skip</button>`}
    </div>
    ${chosen ? `<div class="sub" style="margin-top:8px">${eur(each)} each across ${chosen} ${chosen===1?'person':'people'}.</div>`
             : (hint?'<div class="sub" style="margin-top:8px">Looks like a shared item.</div>':'')}
  </div>`;
}

function lineRow(r,l){
  const owners = lineOwners(l);
  const tags = l.all
    ? '<span class="tag plain">Everyone</span>'
    : owners.map(id=>{ const p=person(id); return p?`<span class="tag" style="background:${p.colour}">${esc(p.tag)}</span>`:''; }).join('');
  return `
  <div class="item">
    <div class="grow">
      <div>${esc(l.desc||'Item')}${l.qty&&l.qty>1?` <span class="muted small">×${l.qty}</span>`:''}</div>
      ${l.en ? `<div class="tiny muted">${esc(l.en)}</div>` : ''}
      <div>${tags || '<span class="tag plain" style="background:var(--warn);color:#000">needs an owner</span>'}
        ${l.note?`<span class="tiny muted">note: ${esc(l.note)}</span>`:''}
        ${l.why?`<span class="tiny muted">· ${esc(l.why)}</span>`:''}</div>
    </div>
    <div style="text-align:right">
      <div class="amt">${eur(l.amount)}</div>
      <div class="tiny muted">${rcad(r, l.amount)}</div>
      <button class="ghost tiny" data-act="clearLine" data-id="${r.id}" data-line="${l.id}" style="padding:2px 6px;border:0;color:var(--muted)">reassign</button>
      <button class="ghost tiny danger" data-act="delLine" data-id="${r.id}" data-line="${l.id}" style="padding:2px 6px;border:0">delete</button>
    </div>
  </div>`;
}

function viewSummary(){
  if(!state.people.length) return '<div class="card"><p class="muted">Add people on the Trip tab first.</p></div>';
  const { owed, paid, owedCad } = tripTotals();
  const units = unitTotals();
  const grandCad = round2(Object.values(owedCad).reduce((a,b)=>a+b,0));
  const anyActual = state.receipts.some(receiptHasActual);
  const anyGroups = units.some(u => u.isGroup);
  const moves = settlements();
  const grand = round2(Object.values(owed).reduce((a,b)=>a+b,0));
  const unassignedTotal = round2(state.receipts.reduce((s,r)=>s+receiptUnassigned(r),0));

  return `
  ${unassignedTotal>0?`<div class="notice">${eur(unassignedTotal)} across your receipts has no owner yet and is not in these figures.</div>`:''}
  <div class="card">
    <h2>What each ${anyGroups ? 'household' : 'person'} owes</h2>
    ${units.map(u => `
      <div class="totrow">
        <span><span class="tag" style="background:${u.colour}">${esc(u.isGroup ? '2+' : person(u.memberIds[0]).tag)}</span> ${esc(u.name)}</span>
        <span>${eur(u.owed)} <span class="tiny muted">${'C$' + u.owedCad.toFixed(2)}</span></span>
      </div>
      ${u.isGroup ? u.memberIds.map(id => `
        <div class="totrow tiny muted" style="padding:2px 0 2px 14px">
          <span>${esc(person(id).name)}</span><span>${eur(owed[id])} · ${'C$' + (owedCad[id]||0).toFixed(2)}</span>
        </div>`).join('') : ''}`).join('')}
    <div class="totrow big"><span>Trip total</span><span>${eur(grand)} <span class="tiny muted">${'C$' + grandCad.toFixed(2)}</span></span></div>
    ${anyActual ? `<p class="sub" style="margin-top:8px">Receipts with an actual amount from your statement convert at their own rate. The rest use the trip rate of C$${(Number(state.trip.rate)||0).toFixed(2)}.</p>` : ''}
  </div>

  <div class="card">
    <h2>Paid versus owed</h2>
    ${units.map(u => {
      const net = round2(u.paid - u.owed);
      const colour = net>0.009?'var(--ok)':(net<-0.009?'var(--danger)':'var(--muted)');
      const word = net>0.009?'is owed':(net<-0.009?'owes':'settled');
      return `<div class="totrow"><span>${esc(u.name)} <span class="tiny muted">paid ${eur(u.paid)}</span></span>
        <span style="color:${colour}">${word} ${net===0?'':eur(Math.abs(net))}</span></div>`;
    }).join('')}
    ${anyGroups ? '<p class="sub" style="margin-top:10px">A household is one balance. Whichever partner paid, the household is credited.</p>' : ''}
  </div>

  <div class="card">
    <h2>Settle up</h2>
    ${moves.length ? moves.map(m=>`
      <div class="totrow"><span><strong>${esc(m.fromName)}</strong> pays <strong>${esc(m.toName)}</strong></span>
      <span>${eur(m.amount)} <span class="tiny muted">${cadAt(blendedRate(), m.amount)}</span></span></div>`).join('')
      : '<p class="muted small">Nobody owes anybody. Set a payer on each receipt to see transfers.</p>'}
    <p class="sub" style="margin-top:10px">Fewest transfers that clear every balance${anyGroups ? ', settled household to household' : ''}. Dollar figures use the trip's blended rate of C$${blendedRate().toFixed(4)}, since a balance spans receipts.</p>
  </div>

  <div class="card">
    <h2>Export</h2>
    <div class="btnrow">
      <button data-act="copySummary">Copy summary text</button>
      <button data-act="exportCsv">Download CSV</button>
    </div>
    <p class="sub" style="margin-top:8px">The CSV carries every line, its owners and both currencies. Drops straight into a spreadsheet.</p>
  </div>`;
}

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const acts = {
    addPerson(){
      const name = (document.getElementById('pName').value||'').trim();
      let tag = (document.getElementById('pTag').value||'').trim();
      if(!name) return;
      if(!tag) tag = name.slice(0,1).toUpperCase();
      if(state.people.some(p=>p.tag.toLowerCase()===tag.toLowerCase())){
        alert('That notation is already taken. Pick something unique, like initials.'); return;
      }
      state.people.push(touch({ id:uid(), name, tag, colour:PALETTE[state.people.length%PALETTE.length] }));
      save(); render();
    },
    delPerson(){
      if(!confirm('Remove this person? Their assignments are cleared.')) return;
      bury('people', id);
      state.people = state.people.filter(p=>p.id!==id);
      state.groups.forEach(g => { g.memberIds = g.memberIds.filter(x => x !== id); });
      state.groups = state.groups.filter(g => groupMembers(g).length > 1);
      ui.newGroupMembers = ui.newGroupMembers.filter(x => x !== id);
      state.receipts.forEach(r=>{
        if(r.payerId===id) r.payerId='';
        r.lines.forEach(l=>{ if(Array.isArray(l.assigned)) l.assigned = l.assigned.filter(x=>x!==id); });
      });
      save(); render();
    },
    newReceipt(){
      const r = touch({ id:uid(), place:'', date:today(), payerId:'', lines:[], extra:'', statedTotal:'', actualCad:'', photo:'' });
      state.receipts.push(r); ui.receiptId=r.id; save(); render();
    },
    openReceipt(){ ui.receiptId=id; ui.queueLine=null; render(); },
    backToList(){ ui.receiptId=null; ui.queueLine=null; render(); },
    delReceipt(){
      if(!confirm('Delete this receipt and all its lines?')) return;
      bury('receipts', id);
      state.receipts = state.receipts.filter(r=>r.id!==id); ui.receiptId=null; save(); render();
    },
    addLine(){
      const r = receipt(id); if(!r) return;
      const desc = (document.getElementById('nlDesc').value||'').trim();
      const amount = parseAmount(document.getElementById('nlAmt').value);
      if(!desc && !amount) return;
      addLines(r, [{ desc, amount, qty:1, note:'' }]);
      save(); render();
    },
    delLine(){
      const r = receipt(id); if(!r) return;
      r.lines = r.lines.filter(l=>l.id!==el.dataset.line); save(); render();
    },
    clearLine(){
      const r = receipt(id); if(!r) return;
      const l = r.lines.find(x=>x.id===el.dataset.line);
      if(l){ l.assigned=[]; l.all=false; l.why=''; ui.queueLine=l.id; } save(); render();
    },
    assignOne(){
      const r = receipt(id); if(!r) return;
      const l = r.lines.find(x=>x.id===el.dataset.line); if(!l) return;
      if(!Array.isArray(l.assigned)) l.assigned = [];
      const pid = el.dataset.person;
      l.assigned = l.assigned.includes(pid) ? l.assigned.filter(x=>x!==pid) : l.assigned.concat(pid);
      l.why = 'you chose';
      syncAllFlag(l);
      ui.queueLine = l.id;          // hold this line so you can add more people
      save(); render();
    },
    assignGroup(){
      const r = receipt(id); if(!r) return;
      const l = r.lines.find(x=>x.id===el.dataset.line); if(!l) return;
      const ids = groupMembers(group(el.dataset.group));
      if(!ids.length) return;
      const picked = Array.isArray(l.assigned) ? l.assigned.slice() : [];
      const alreadyAll = ids.every(x => picked.includes(x));
      l.assigned = alreadyAll
        ? picked.filter(x => !ids.includes(x))                       // tap again to clear
        : picked.concat(ids.filter(x => !picked.includes(x)));
      l.why = 'you chose';
      syncAllFlag(l);
      ui.queueLine = l.id;
      save(); render();
    },
    toggleGroupMember(){
      ui.newGroupMembers = ui.newGroupMembers.includes(id)
        ? ui.newGroupMembers.filter(x => x !== id)
        : ui.newGroupMembers.concat(id);
      render();
    },
    addGroup(){
      const members = ui.newGroupMembers.filter(x => person(x) && !groupOf(x));
      if(members.length < 2) return;
      const name = (ui.newGroupName || '').trim()
        || members.map(x => person(x).name).join(' & ');
      state.groups.push(touch({ id: uid(), name, memberIds: members }));
      ui.newGroupMembers = []; ui.newGroupName = '';
      save(); render();
    },
    delGroup(){
      bury('groups', id);
      state.groups = state.groups.filter(g => g.id !== id);
      save(); render();
    },
    assignAll(){
      const r = receipt(id); if(!r) return;
      const l = r.lines.find(x=>x.id===el.dataset.line); if(!l) return;
      l.assigned = everyoneNow(); l.why = 'everyone'; syncAllFlag(l);
      ui.queueLine = null;          // unambiguous, so move straight on
      save(); render();
    },
    nextLine(){ ui.queueLine = null; render(); },
    skipLine(){
      const r = receipt(id); if(!r) return;
      const i = r.lines.findIndex(x=>x.id===el.dataset.line);
      if(i>-1){ const [l]=r.lines.splice(i,1); r.lines.push(l); }

  }
});

/* Typing in a figure that changes other figures has to redraw them, and a
   redraw replaces the field you are typing in. So put the cursor back. */
let redrawTimer = null;
function redrawSoon(el){
  const act = el.dataset.act, id = el.dataset.id || '', pos = el.selectionStart;
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(() => {
    render();
    const again = document.querySelector(`[data-act="${act}"]${id ? `[data-id="${id}"]` : ''}`);
    if(!again) return;
    again.focus();
    try{ again.setSelectionRange(pos, pos); }catch(err){ /* not a text field */ }
  }, 350);
}

async function shareTrip(){

/* A backup you cannot put back is not a backup. Reading a file only
   offers the choice; nothing changes until merge or replace is tapped. */
async function restoreBackup(file){
  let text, obj;
  try{ text = await file.text(); }
  catch(e){ alert('That file could not be opened.'); return; }
  try{ obj = JSON.parse(text); }
  catch(e){ alert('That file is not readable as a trip. It should be the .json file this app produced.'); return; }

  const why = validateBackup(obj);
  if(why){ alert(why); return; }

  const incoming = hydrate(obj);
  if(!state.people.length && !state.receipts.length){
    await applyImport(incoming, 'replace');        // nothing here to weigh it against
    return;
  }
  ui.pendingImport = incoming;
  ui.tab = 'trip';
  render();
}

async function applyImport(incoming, how){
  try{ await storePut('snap:' + new Date().toISOString() + '-before-' + how, state); }catch(e){}
  const before = { people: state.people.length, receipts: state.receipts.length };
  state = how === 'merge' ? mergeTrips(state, incoming) : incoming;
  ui.pendingImport = null;
  ui.receiptId = null; ui.queueLine = null; ui.tab = 'trip';
  ui.newGroupMembers = []; ui.newGroupName = '';
  save(); render();
  alert(how === 'merge'
    ? `Merged. ${before.receipts} receipts here and ${incoming.receipts.length} in the file came to ${state.receipts.length}.`
    : `Replaced. ${state.people.length} people and ${state.receipts.length} receipts are in place.`);
}

/* ---------- adding lines with notation matching ---------- */
function addLines(r, raw){
  for(const x of raw){
    const desc = (x.desc||'').trim();
    const line = {
      id: uid(),
      desc,
      en: (x.en||'').trim() || translateItem(desc) || '',
      amount: round2(parseAmount(x.amount)),
      qty: Number(x.qty)||1,
      note: (x.note||'').trim(),
      assigned: [],
      why: ''
    };
    if(line.en.toLowerCase() === desc.toLowerCase()) line.en = '';
    const m = matchNotation(line.desc + ' ' + line.note);
    if(m){
      line.assigned = m.ids === 'ALL' ? everyoneNow() : m.ids;
      line.why = m.why;
    }
    syncAllFlag(line);
    r.lines.push(line);
  }
}

/* ---------- plain text parsing ---------- */
/* Lines a till prints that are not things anyone ate. */
const SKIP_LINE = /^(totale|total|subtotale|sub-?totale|resto|contanti|carta|bancomat|pagato|pagamento|importo|grazie|arrivederci|scontrino|documento|commerciale|iva|imponibile|servizio incluso|coperti n)\b/i;
/* Dishes whose name opens with a number, so it is not a quantity. */
const NUMBER_DISHES = /^(formaggi|stagioni|gusti|salse|sapori)\b/i;

function parseReceiptText(txt){
  const rows = String(txt).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const out = [];
  let heldName = '';          // an item whose price is printed on the next line

  for(const line of rows){
    if(SKIP_LINE.test(line)){ heldName = ''; continue; }

    // "4 x 3,00      12,00" - a quantity line belonging to the name above it.
    // The figure that matters is the line total on the right, not the unit price.
    const qtyRow = line.match(/^(\d{1,3})\s*[x×]\s*(-?\d{1,5}[.,]\d{2})\s+(-?\d{1,6}[.,]\d{2})\s*(.*)$/i);
    if(qtyRow){
      out.push({ desc: heldName || 'Item', amount: qtyRow[3], qty: parseInt(qtyRow[1], 10), note: (qtyRow[4]||'').trim() });
      heldName = '';
      continue;
    }

    const m = line.match(/^(.*?)[\s.]*(-?\d{1,4}[.,]\d{2})\s*(?:€|eur)?\s*(.*)$/i);
    if(!m){
      // Words with no figure: most likely an item waiting for its price.
      if(/[a-z]{3}/i.test(line)) heldName = line;
      continue;
    }

    let desc = m[1].trim(), amount = m[2], trailing = (m[3]||'').trim();
    desc = desc.replace(/[\s.·•]+$/,'').replace(/\s*(€|eur)\s*$/i,'').trim();

    let qty = 1;
    const times = desc.match(/^(\d{1,3})\s*[x×]\s*(.+)$/i);
    const bare  = desc.match(/^(\d{1,2})\s+(.+)$/);
    if(times){ qty = parseInt(times[1], 10); desc = times[2].trim(); }
    else if(bare && !NUMBER_DISHES.test(bare[2])){ qty = parseInt(bare[1], 10); desc = bare[2].trim(); }

    if(!desc) desc = heldName || 'Item';
    heldName = '';
    out.push({ desc, amount, qty, note: trailing });
  }

  return dropPrintedColumns(out);
}

/* A short token printed after nearly every amount is a column the till
   prints, usually the VAT class, and real receipts mix them: A on food,
   B on alcohol. Left in the note it reads as someone's initials and
   assigns the line to them silently, which is the worst way to be wrong.
   Dropping a genuine notation by mistake only sends the line to the
   queue, where you tap the name. That is the safer way to be wrong. */
function dropPrintedColumns(lines){
  if(lines.length < 3) return lines;
  const looksLikeClass = t => /^[A-Za-z]{1,2}\d?$/.test(t);
  const marked = lines.filter(l => l.note && looksLikeClass(l.note));
  if(marked.length >= 3 && marked.length / lines.length >= 0.75){
    marked.forEach(l => l.note = '');
  }
  return lines;
}

/* Thermal receipts photograph badly: grey on grey, uneven light, small
   print. Binarizing against a local average lifts the text off the
   background far better than handing the reader the photo as taken.
   Bradley's method, with an integral image so the window costs nothing. */
function prepareForOcr(dataUrl, wantWidth){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try{
        const MAX_PIXELS = 3.2e6;                       // keeps a phone comfortable
        let scale = Math.min(2.5, Math.max(1, wantWidth / img.width));
        if(img.width * img.height * scale * scale > MAX_PIXELS){
          scale = Math.sqrt(MAX_PIXELS / (img.width * img.height));
        }
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));

        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        const im = ctx.getImageData(0, 0, w, h);
        const px = im.data;

        const grey = new Uint8ClampedArray(w * h);
        for(let i = 0, j = 0; j < grey.length; i += 4, j++){
          grey[j] = (px[i] * 0.299 + px[i+1] * 0.587 + px[i+2] * 0.114) | 0;
        }

        const stride = w + 1;
        const sum = new Uint32Array(stride * (h + 1));
        for(let y = 0; y < h; y++){
          let run = 0;
          for(let x = 0; x < w; x++){
            run += grey[y * w + x];
            sum[(y + 1) * stride + (x + 1)] = sum[y * stride + (x + 1)] + run;
          }
        }

        const win  = Math.max(15, Math.round(w / 12)) | 1;   // odd, about a word wide
        const half = win >> 1;
        const BIAS = 0.86;                                   // darker than 86% of local mean is ink
        for(let y = 0; y < h; y++){
          const y0 = Math.max(0, y - half), y1 = Math.min(h - 1, y + half);
          for(let x = 0; x < w; x++){
            const x0 = Math.max(0, x - half), x1 = Math.min(w - 1, x + half);
            const count = (x1 - x0 + 1) * (y1 - y0 + 1);
            const area = sum[(y1+1)*stride + (x1+1)] - sum[y0*stride + (x1+1)]
                       - sum[(y1+1)*stride + x0]     + sum[y0*stride + x0];
            const ink = grey[y * w + x] * count < area * BIAS ? 0 : 255;
            const i = (y * w + x) * 4;
            px[i] = px[i+1] = px[i+2] = ink; px[i+3] = 255;
          }
        }
        ctx.putImageData(im, 0, 0);
        resolve(c.toDataURL('image/png'));       // lossless, so no JPEG fuzz around letters
      }catch(err){
        resolve(dataUrl);                        // any trouble, use the photo as taken
      }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* A small copy to recognise the receipt by later. The full photo is far
   too big to keep: a handful would fill the browser's storage and stop
   the trip itself from saving. */
function thumbnail(dataUrl, maxWidth){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => resolve('');
    img.src = dataUrl;
  });
}

function shrink(file, maxDim){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxDim/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', 0.82);
      resolve({ dataUrl, base64: dataUrl.split(',')[1], mime:'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file did not load as an image.')); };
    img.src = url;
  });
}

const EXTRACT_PROMPT = `You are reading a receipt from Italy. Extract every purchased line item.

Return ONLY a JSON object, no prose and no code fence:
{"place": string|null, "date": "YYYY-MM-DD"|null, "total": number|null,
 "lines": [{"qty": number, "desc": string, "en": string, "amount": number, "note": string|null}]}

Rules:
- amount is that line's total in euros as a plain number, decimal point, e.g. 14.5
- desc keeps the Italian wording as printed
- en is a short plain English reading of desc, e.g. "Branzino alla griglia" gives "Grilled sea bass". Use the English name itself where one exists, and repeat desc when it is already English or is a brand name
- note holds any handwritten mark, initials or letters written beside the line, copied verbatim; otherwise null
- include coperto, servizio and any discount lines (discounts negative)
- do not include the grand total, change, payment method or VAT summary as lines
- where the till prints the item name on one line and its quantity and price on the next, such as "Coperto" then "4 x 3,00   12,00", that is one item: use the name above, the quantity, and the total on the right. Never the unit price
- a single letter printed after the amount, such as A or B, is the VAT class the till prints on every line. It is not a handwritten mark, so leave note null
- do not invent lines you cannot read`;

async function readWithClaude(img, r){
  const body = {
    model: state.model || 'claude-opus-5',
    max_tokens: 8000,
    output_config: { effort: 'low' },
    messages: [{
      role: 'user',
      content: [
        { type:'image', source:{ type:'base64', media_type: img.mime, data: img.base64 } },
        { type:'text', text: EXTRACT_PROMPT }
      ]
    }]
  };
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': getKey(),
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const t = await res.text();
    if(res.status===401) throw new Error('The API key was rejected. Check it on the Trip tab.');
    if(res.status===429) throw new Error('Rate limited. Wait a moment and try again.');
    throw new Error(`Claude returned ${res.status}. ${t.slice(0,180)}`);
  }
  const data = await res.json();
  if(data.stop_reason === 'refusal') throw new Error('Claude declined to read that image.');
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  const parsed = parseJsonLoose(text);
  if(!parsed || !Array.isArray(parsed.lines)) throw new Error('Could not read the response as receipt lines.');
  if(parsed.place && !r.place) r.place = parsed.place;
  if(parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date)) r.date = parsed.date;
  if(parsed.total && !parseAmount(r.statedTotal)) r.statedTotal = String(parsed.total);
  return parsed.lines.map(l => ({ desc:l.desc, en:l.en||'', amount:l.amount, qty:l.qty||1, note:l.note||'' }));
}

function parseJsonLoose(text){
  try{ return JSON.parse(text); }catch(e){}
  const m = text.match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}

async function readWithTesseract(dataUrl){
  const status = document.getElementById('ocrStatus');
  const say = t => { if(status) status.innerHTML = t; };

  say('<span class="spin"></span> Loading the on-device reader...');
  if(!window.Tesseract) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js');
  if(!window.Tesseract) throw new Error('On-device OCR needs a connection the first time. Paste the text instead, or add an API key.');

  say('<span class="spin"></span> Sharpening the photo...');
  const prepared = await prepareForOcr(dataUrl, 1800);

  say('<span class="spin"></span> Reading the photo on your device...');
  let text = '';
  if(window.Tesseract.createWorker){
    const worker = await window.Tesseract.createWorker('ita+eng', 1, { logger: () => {} });
    try{
      await worker.setParameters({
        tessedit_pageseg_mode: '4',       // one column of text, which is what a receipt is
        preserve_interword_spaces: '1'    // keeps the gap between an item and its price
      });
      const { data } = await worker.recognize(prepared);
      text = data.text || '';
    }finally{
      try{ await worker.terminate(); }catch(e){}
    }
  }else{
    const out = await window.Tesseract.recognize(prepared, 'ita+eng');
    text = out.data.text || '';
  }
  return parseReceiptText(text);
}

function loadScript(src){
  return new Promise(resolve => {
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(true); s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

/* ---------- exports ---------- */
function download(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function csvCell(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
function exportCsv(){
  const { owed, paid, owedCad, paidCad } = tripTotals();
  const rows = [['Date','Place','Item','Item in English','Qty','Amount EUR','Amount CAD','Rate used','Rate source','Assigned to','Per person EUR','Note','Payer','Payer household']];
  for(const r of state.receipts){
    for(const l of r.lines){
      const owners = lineOwners(l);
      const names = l.all ? 'Everyone' : owners.map(id=>person(id).name).join(' + ');
      const each = owners.length ? round2(l.amount/owners.length) : 0;
      rows.push([r.date, r.place, l.desc, l.en||'', l.qty, round2(l.amount).toFixed(2),
        round2(l.amount*receiptRate(r)).toFixed(2), receiptRate(r).toFixed(4),
        receiptHasActual(r) ? 'card statement' : 'trip rate', names || 'UNASSIGNED',
        each.toFixed(2), l.note||'', r.payerId?person(r.payerId).name:'',
        r.payerId && groupOf(r.payerId) ? groupOf(r.payerId).name : '']);
    }
    if(parseAmount(r.extra)) rows.push([r.date, r.place, 'Tip or rounding', '', 1, round2(parseAmount(r.extra)).toFixed(2),
      round2(parseAmount(r.extra)*receiptRate(r)).toFixed(2), receiptRate(r).toFixed(4),
      receiptHasActual(r) ? 'card statement' : 'trip rate', 'Split by share','', '', r.payerId?person(r.payerId).name:'',
      r.payerId && groupOf(r.payerId) ? groupOf(r.payerId).name : '']);
  }
  rows.push([]);
  rows.push(['Person','Household','Owes EUR','Owes CAD','Paid EUR','Paid CAD','Net EUR','Net CAD']);
  state.people.forEach(p => rows.push([p.name, groupOf(p.id)?groupOf(p.id).name:'', owed[p.id].toFixed(2),
    owedCad[p.id].toFixed(2), paid[p.id].toFixed(2), paidCad[p.id].toFixed(2),
    round2(paid[p.id]-owed[p.id]).toFixed(2), round2(paidCad[p.id]-owedCad[p.id]).toFixed(2)]));
  rows.push([]);
  rows.push(['Settles as','Owes EUR','Owes CAD','Paid EUR','Paid CAD','Net EUR','Net CAD']);
  unitTotals().forEach(u => rows.push([u.name, u.owed.toFixed(2), u.owedCad.toFixed(2),
    u.paid.toFixed(2), u.paidCad.toFixed(2),
    round2(u.paid-u.owed).toFixed(2), round2(u.paidCad-u.owedCad).toFixed(2)]));
  rows.push([]);
  rows.push(['Receipt','Date','Total EUR','Total CAD','Rate used','Rate source']);
  state.receipts.forEach(r => rows.push([r.place, r.date, receiptGrandEur(r).toFixed(2),
    round2(receiptGrandEur(r)*receiptRate(r)).toFixed(2), receiptRate(r).toFixed(4),
    receiptHasActual(r) ? 'card statement' : 'trip rate']));
  const csv = '﻿' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  download(new Blob([csv],{type:'text/csv;charset=utf-8'}), (state.trip.name||'trip').replace(/\W+/g,'-').toLowerCase()+'-split.csv');
}
function summaryText(){
  const { owed, paid } = tripTotals();
  const anyActual = state.receipts.some(receiptHasActual);
  const lines = [`${state.trip.name} - bill split`,
    anyActual
      ? `Blended rate: EUR 1 = CAD ${blendedRate().toFixed(4)} (some receipts converted at the actual charged)`
      : `Rate used: EUR 1 = CAD ${(state.trip.rate||0).toFixed(2)}`,
    ''];
  unitTotals().forEach(u => {
    lines.push(`${u.name}: ${eur(u.owed)} (C$${u.owedCad.toFixed(2)}), paid ${eur(u.paid)}`);
    if(u.isGroup) u.memberIds.forEach(id => lines.push(`   ${person(id).name}: ${eur(owed[id])}`));
  });
  const moves = settlements();
  if(moves.length){
    lines.push('', 'Settle up:');
    moves.forEach(m => lines.push(`${m.fromName} pays ${m.toName} ${eur(m.amount)} (${cadAt(blendedRate(), m.amount)})`));
  }
  return lines.join('\n');
}
function copySummary(btn){
  const txt = summaryText();
  const done = () => { btn.textContent = 'Copied'; setTimeout(()=>btn.textContent='Copy summary text', 1600); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done, ()=>fallback()); }
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ alert(txt); }
    ta.remove();
  }
}

/* ---------- staying up to date -----------------------------------
   A new version waits rather than barging in mid-receipt. The banner
   appears, and one tap hands over and reloads.
------------------------------------------------------------------ */
let swReg = null, swWaiting = null, reloading = false;

function offerUpdate(worker){
  swWaiting = worker;
  const bar = document.getElementById('updateBar');
  if(bar) bar.classList.remove('hidden');
}

function watchWorker(worker){
  if(!worker) return;
  worker.addEventListener('statechange', () => {
    // A controller already in charge means this one is a replacement.
    if(worker.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(worker);
  });
}

function setupUpdates(){
  if(!('serviceWorker' in navigator) || !window.isSecureContext) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    watchWorker(reg.installing);
    reg.addEventListener('updatefound', () => watchWorker(reg.installing));
  }).catch(()=>{});

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(reloading) return;          // one reload, never a loop
    reloading = true;
    location.reload();
  });
}

async function checkForUpdate(){
  const box = document.getElementById('updateStatus');
  const say = t => { if(box) box.innerHTML = t; };
  if(!swReg){
    say('Updates arrive when you open the app from its web address. A copy opened from a file stays as it is.');
    return;
  }
  say('<span class="spin"></span> Checking...');
  try{
    await swReg.update();
    await new Promise(r => setTimeout(r, 400));    // small margin for the state to settle
    if(swReg.waiting) say('A new version is ready. Tap Update now in the banner.');
    else if(swReg.installing) say('A new version is downloading. The banner appears when it is ready.');
    else say('You are on the latest version.');
  }catch(e){
    say('Could not reach the server. You are likely offline.');
  }
}

/* ---------- boot ---------- */
render();                                    // draw something immediately
(async function boot(){
  try{ state = await loadState(); }catch(e){}
  render();
  setupUpdates();
})();
</script>
